<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="apple-mobile-web-app-capable" content="yes">

		<!-- favicons -->
		<link rel="apple-touch-icon" href="/managers/GGL.png">
		<link rel="icon" type="image/png" sizes="32x32" href="/favicons/favicon-32x32.png">
		<link rel="icon" type="image/png" sizes="16x16" href="/favicons/favicon-16x16.png">
		<link rel="mask-icon" href="/favicons/safari-pinned-tab.svg" color="#00316b">
		<link rel="shortcut icon" href="/favicons/favicon.ico">
		<meta name="apple-mobile-web-app-title" content="GGL">
		<meta name="application-name" content="GGL">
		<meta name="msapplication-TileColor" content="#00316b">
		<meta name="msapplication-config" content="/favicons/browserconfig.xml">
		<meta name="theme-color" content="#00316b">

		<!-- PWA -->
		<link rel="manifest" href="/manifest.json">

		<!-- Fonts and CSS -->
		<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons&display=swap" />
		<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,600,700&display=swap" />
		<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto+Mono&display=swap" />

		<!-- SMUI Styles -->
		<link rel="stylesheet" href="/smui.css" media="(prefers-color-scheme: light)" />
		<link rel="stylesheet" href="/smui-dark.css" media="(prefers-color-scheme: dark)" />

		<!-- Keep archive controls beneath the mobile drawer -->
		<style>
			.yearNav,
			.videoArrow,
			.photoArrow { z-index: 1 !important; }

			#ggl-splash {
				display: none;
				position: fixed;
				inset: 0;
				z-index: 2147483647;
				align-items: center;
				justify-content: center;
				background: #00316b;
				opacity: 1;
				transition: opacity 180ms ease;
			}

			#ggl-splash img {
				width: min(42vw, 220px);
				height: auto;
				display: block;
			}

			@media (display-mode: standalone) {
				#ggl-splash { display: flex; }
			}

			#ggl-splash.ggl-splash-hide {
				opacity: 0;
				pointer-events: none;
			}
		</style>
		%sveltekit.head%
	</head>
	<body>
		<div id="ggl-splash" aria-hidden="true">
			<img src="/managers/GGL.png" alt="" />
		</div>
		<div id="svelte">%sveltekit.body%</div>
		<script>
			(function () {
				var splash = document.getElementById('ggl-splash');
				var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
				if (!standalone || !splash) return;

				var started = Date.now();
				var minimumVisibleTime = 450;

				function hideSplash() {
					var remaining = Math.max(0, minimumVisibleTime - (Date.now() - started));
					setTimeout(function () {
						splash.classList.add('ggl-splash-hide');
						setTimeout(function () {
							splash.remove();
						}, 200);
					}, remaining);
				}

				if (document.readyState === 'complete') {
					hideSplash();
				} else {
					window.addEventListener('load', hideSplash, { once: true });
					setTimeout(hideSplash, 2500);
				}
			})();
		</script>
	</body>
</html>
